name: Build Dropbear PPv2 IPK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ImmortalWrt 24.10.6 build system
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v24.10.6
          path: openwrt

      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: realip

      - name: Validate PPv2 patch script syntax
        run: python3 -m py_compile realip/scripts/patch_dropbear_ppv2.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Pin Dropbear source and inject PPv2 Build/Prepare hook
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('package/network/services/dropbear/Makefile')
          s = p.read_text()

          s, n = re.subn(r'^PKG_VERSION:=.*$', 'PKG_VERSION:=2026.91', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('Could not pin PKG_VERSION to 2026.91')
          s, n = re.subn(r'^PKG_RELEASE:=.*$', 'PKG_RELEASE:=3', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('Could not set PKG_RELEASE to 3')

          start = s.find('PKG_SOURCE_URL:=')
          end = s.find('PKG_HASH:=', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate Dropbear source URL/hash block')
          source_url = (
              'PKG_SOURCE_URL:= \\\n'
              '\thttps://matt.ucc.asn.au/dropbear/releases/ \\\n'
              '\thttps://dropbear.nl/mirror/releases/\n'
          )
          s = s[:start] + source_url + s[end:]
          s, n = re.subn(
              r'^PKG_HASH:=.*$',
              'PKG_HASH:=defa924475abf6bc1e74abc00173e46bfdc804bd47caafa14f5a4ef0cc76da34',
              s, count=1, flags=re.M
          )
          if n != 1:
              raise SystemExit('Could not pin Dropbear 2026.91 tarball hash')

          # Keep ImmortalWrt's existing compile options; only disable its
          # Linux re-exec optimization so PPv2 metadata survives into session.
          option_anchor = 'DB_OPT_COMMON = \\\n'
          if 'DROPBEAR_REEXEC,0' not in s:
              if option_anchor not in s:
                  raise SystemExit('Could not find DB_OPT_COMMON in Dropbear Makefile')
              s = s.replace(option_anchor, option_anchor + '\tDROPBEAR_REEXEC,0 \\\n', 1)

          anchor = '$(eval $(call BuildPackage,dropbear))'
          hook = (
              'define Build/Prepare\n'
              '\t$(call Build/Prepare/Default)\n'
              '\tpython3 $(TOPDIR)/../realip/scripts/patch_dropbear_ppv2.py "$(PKG_BUILD_DIR)"\n'
              'endef\n\n'
          )
          if 'patch_dropbear_ppv2.py' not in s:
              if anchor not in s:
                  raise SystemExit('Could not find dropbear BuildPackage anchor')
              s = s.replace(anchor, hook + anchor, 1)

          if 'PKG_VERSION:=2026.91' not in s or 'PKG_RELEASE:=3' not in s:
              raise SystemExit('Version pin verification failed')
          if 'PKG_HASH:=defa924475abf6bc1e74abc00173e46bfdc804bd47caafa14f5a4ef0cc76da34' not in s:
              raise SystemExit('Source hash verification failed')
          # These two ImmortalWrt patches were already merged into the
          # upstream Dropbear 2026.91 release. Reapplying the old backports
          # fails against the updated source and can duplicate code changes.
          obsolete_upstream_patches = [
              Path('package/network/services/dropbear/patches/001-Drop-privileges-after-user-authentication.patch'),
              Path('package/network/services/dropbear/patches/002-Remove-return-code-from-login_login.patch'),
          ]
          for patch in obsolete_upstream_patches:
              if patch.exists():
                  patch.unlink()
                  print(f'Removed obsolete backport already present in Dropbear 2026.91: {patch}')
              else:
                  print(f'Obsolete backport already absent: {patch}')

          legacy_pubkey_patch = Path('package/network/services/dropbear/patches/100-pubkey_path.patch')
          if legacy_pubkey_patch.exists():
              legacy_pubkey_patch.unlink()
              print('Removed legacy pubkey-path patch; its /etc/dropbear root-key behavior is ported into patch_dropbear_ppv2.py')
          if any(patch.exists() for patch in obsolete_upstream_patches) or legacy_pubkey_patch.exists():
              raise SystemExit('Legacy patches must not be applied to Dropbear 2026.91')
          if 'DROPBEAR_REEXEC,0' not in s or 'patch_dropbear_ppv2.py' not in s:
              raise SystemExit('PPv2/re-exec package hook verification failed')

          p.write_text(s)
          print('Pinned Dropbear 2026.91-3, verified source hash, disabled re-exec, and installed PPv2 prepare hook.')
          PY

      - name: Configure qualcommax/ipq807x package architecture
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_PACKAGE_dropbear=y
          EOF
          make defconfig
          echo "===== target and architecture ====="
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq807x|ARCH_PACKAGES)=' .config
          grep -qx 'CONFIG_TARGET_qualcommax=y' .config
          grep -qx 'CONFIG_TARGET_qualcommax_ipq807x=y' .config
          grep -qx 'CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"' .config
          grep -qx 'CONFIG_PACKAGE_dropbear=y' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j4

      - name: Build host tools
        working-directory: openwrt
        run: |
          set -o pipefail
          make tools/install -j2 V=s 2>&1 | tee ../realip/artifacts-host-tools.log

      - name: Build target toolchain
        working-directory: openwrt
        run: |
          set -o pipefail
          make toolchain/install -j1 V=s 2>&1 | tee ../realip/artifacts-toolchain.log

      - name: Prepare, patch, and compile Dropbear once
        working-directory: openwrt
        run: |
          set -o pipefail
          mkdir -p ../realip/artifacts
          make package/network/services/dropbear/prepare V=s -j1 2>&1 | tee ../realip/artifacts/prepare.log

          SOURCE_DIR="$(find build_dir -type d -name 'dropbear-2026.91' -print -quit)"
          test -n "$SOURCE_DIR"
          echo "Dropbear source directory: $SOURCE_DIR"

          # Running the patch a second time proves it is idempotent and checks
          # that all expected code paths were changed.
          python3 ../realip/scripts/patch_dropbear_ppv2.py "$SOURCE_DIR"

          set -o pipefail
          make package/network/services/dropbear/compile V=s -j1 2>&1 | tee ../realip/artifacts/build.log

          echo "===== verify compile options ====="
          grep -Eq '^#define DROPBEAR_REEXEC 0$' "$SOURCE_DIR/localoptions.h"
          echo "OK: DROPBEAR_REEXEC=0"

          echo "===== verify PPv2 source integration ====="
          grep -q 'qwrt_pp2_is_trusted_proxy' "$SOURCE_DIR/svr-main.c"
          grep -q 'svr_get_remote_address' "$SOURCE_DIR/svr-session.c"
          grep -q 'svr_get_remote_address' "$SOURCE_DIR/svr-chansession.c"

      - name: Verify package metadata, ELF, and PPv2 code
        working-directory: openwrt
        run: |
          set -eu
          mkdir -p ../realip/artifacts
          find bin/packages -type f -name 'dropbear*.ipk' -print

          IPK="$(find bin/packages -type f -name 'dropbear_2026.91-r3_*.ipk' -print -quit)"
          test -n "$IPK"
          cp -f "$IPK" ../realip/artifacts/

          echo "===== package archive ====="
          tar -tzf "$IPK"

          CONTROL="$(tar -xzOf "$IPK" ./control.tar.gz | tar -xzOf - ./control)"
          printf '%s\n' "$CONTROL" | grep -E '^(Package|Version|Architecture|Depends):'
          printf '%s\n' "$CONTROL" | grep -qx 'Architecture: aarch64_cortex-a53'
          printf '%s\n' "$CONTROL" | grep -Eq '^Version: 2026\.91-r3$'

          echo "===== extract package files ====="
          tar -xzOf "$IPK" ./data.tar.gz | tar -xz -C ../realip/artifacts/ -f -
          BIN="../realip/artifacts/usr/sbin/dropbear"
          test -s "$BIN"
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class:|Machine:'
          readelf -h "$BIN" | grep -q 'AArch64'

          echo "===== verify PPv2 strings are present in packaged server ====="
          strings -a "$BIN" | grep -F 'invalid Proxy Protocol v2 header'
          strings -a "$BIN" | grep -F '192.168.0.254'
          strings -a "$BIN" | grep -F 'SSH_CONNECTION'

          echo "===== hashes ====="
          sha256sum "$IPK" ../realip/artifacts/usr/sbin/dropbear

      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-ppv2-immortalwrt-24.10.6-aarch64-cortex-a53
          path: |
            realip/artifacts/*.ipk
            realip/artifacts/*.log
            realip/artifacts/usr/sbin/dropbear
            realip/artifacts-host-tools.log
            realip/artifacts-toolchain.log
          if-no-files-found: warn
          retention-days: 30
